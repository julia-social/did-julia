name: tests

on:
  # Pull requests cover every branch; pushing to main covers the merge itself.
  # Running on both events for every branch would double every check.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a protocol or endpoint change that breaks live resolution is
    # noticed here rather than by a user.
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python reference resolver (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -c "import chia_rs, did_julia.clvm_util as c; print('chia_rs', getattr(chia_rs, '__version__', 'unknown'), 'RUN_FLAGS', c.RUN_FLAGS)"
      # The suite replays the committed mainnet recordings in tests/fixtures;
      # it makes no network calls, so a Coinset outage can never fail a PR.
      - name: Test
        run: python -m pytest -q

  typescript:
    name: TypeScript resolver (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Format
        run: npm run format:check
      # Includes the byte-equivalence assertions against the Python reference
      # resolver's recorded output, and the check that this package's fixture
      # copies match the repository's originals.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  canaries:
    name: Live mainnet canaries
    # Deliberately NOT a pull-request gate: this one talks to a public Chia
    # node, so its failures are news about the chain or the endpoint, not about
    # the commit under test. The offline jobs above are the gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Resolve the canary DIDs against Chia mainnet
        run: python scripts/check_canaries.py
